# orfi-kit-cpp-code-review — enforcement contract
#
# Machine-read by ~/.claude/hooks/orfi-kit-verify-skill-contract.sh (a Stop hook).
# See the C# contract beside orfi-kit-csharp-code-review/SKILL.md for the full
# rationale and the directive format; this file assumes both.
#
# Why this requires less of the toolchain than the C# contract. Keep two things
# apart — conflating them is easy and gets the reasoning backwards:
#
#   RULES are never missing. If the repo ships .clang-format / .clang-tidy, that
#   config is the contract. If it ships neither — the common C++ case — the
#   authority ladder falls back to CONFIG.md's baseline and ENFORCES it (exactly
#   what orfi-kit-load-cpp-conventions.sh does at write time). A style finding
#   always has an authority to cite, so "no config" never means "nothing to check".
#
#   EXECUTABLES genuinely may be absent, and that is what a `require::bash` row
#   depends on. clang-format, clang-tidy, and the build/test drivers are separate
#   installs, and clang-tidy additionally needs a compile_commands.json that
#   SKILL.md forbids generating — producing one is a build action, not a review
#   action. In C# the equivalents ship with the SDK: if dotnet exists, so do
#   format, build, and test.
#
# This contract can only require COMMANDS, so only the second category applies.
# Requiring `clang-tidy -p build` in a repo with no compilation database would
# make the gate fire on correct behaviour, and a gate that cries wolf gets
# bypassed and then ignored. Build and test commands also vary per project (make,
# ninja, msbuild, ctest, or a project script), so pinning literal strings would be
# wrong more often than right.
#
# So: enforce the two companion skills, the scope diff, and the traps. The tool
# lane stays prose-mandated, with SKILL.md still demanding that anything which
# could not run is named and its result treated as unconfirmed rather than clean.

# --- When to check ----------------------------------------------------------
report-marker::Scope
report-marker::Sources
report-marker::Tools
report-marker::Findings
report-marker::Verdict
report-min::3

# --- The two companions -----------------------------------------------------
require::skill::orfi-kit-doxygen-docs::/orfi-kit-doxygen-docs companion skill::doxygen
require::skill::security-review::/security-review companion skill::security.{0,3}review

# --- Scope resolution -------------------------------------------------------
require::bash::git diff --name-only::branch diff over C/C++ sources (scope resolution)::git diff

# --- Traps ------------------------------------------------------------------
# Both spellings: pwsh takes `-Changed`, bash takes `--changed`.
forbid::bash::check-doxygen-docs[^"]*--?[Cc]hanged::check-doxygen-docs run with -Changed/--changed::--changed (bash) and -Changed (pwsh) inspect only UNCOMMITTED work; at review time that is an empty list and a meaningless exit 0. Use -Files/--files with the branch diff.
forbid::bash::merge-base +HEAD +@\{u\}::base resolved with @{u}::@{u} is this branch's own remote, so the diff omits already-pushed commits. Resolve the fork point from the parent epic branch or the trunk.
# A review reports; it never rewrites the code under review.
forbid::bash::clang-format +(-i|--in-place)::clang-format -i (rewrites the code under review)::a review reports what differs. Use --dry-run -Werror.
