# orfi-kit-csharp-code-review — enforcement contract (Codex copy)
#
# MECHANICALLY ENFORCED WHEN THE NATIVE HOOKS ARE INSTALLED — READ THIS FIRST.
#
# This file is kept beside SKILL.md in both variants so they cannot drift apart.
# It is read by ~/.claude/hooks/orfi-kit-verify-skill-contract.sh, which Claude
# Code wires as a Stop hook and the Copilot copy registers as a native Stop hook
# (~/.copilot/hooks/orfi-kit.json). Codex has a Stop event but this contract is
# deliberately NOT wired there — Codex's transcript format is not a stable
# interface for hooks, and wiring it would produce a hook that always passes
# (strictly worse than not shipping it). OpenCode has no Stop event, same result.
# On Codex and OpenCode these rows are a CHECKLIST, not a gate: nothing will
# catch you skipping one.
#
# Treat every `require` as mandatory regardless, and every `forbid` as a trap that
# silently yields a pass which inspected nothing. On Claude Code and on a Copilot
# install with native hooks, the same rows ARE enforced — a Stop hook blocks the
# report when one has no tool_use record.
#
# Machine-read by ~/.claude/hooks/orfi-kit-verify-skill-contract.sh (Claude Code
# settings.json + Copilot ~/.copilot/hooks/orfi-kit.json).
# The Codex rows are a checklist — the SKILL.md section "The mandatory steps,
# restated as a checklist" says why.
# This file is the ENFORCED half of SKILL.md: every row below is a step the prose
# already mandates, restated in a form a hook can check against the session
# transcript. Prose alone did not bind — a review was reported three times in one
# session with /security-review and /orfi-kit-xml-docs never invoked at all, and
# the transcript proves it: across every session in this project there is not one
# `"skill":"security-review"` record. Hence this file.
#
# Why the transcript is the ledger: `tool_use` records are written by the harness,
# not by the model. A model can write "invoked /security-review" in prose; it
# cannot write a tool_use record that never happened. So the record is evidence
# and the prose is a claim.
#
# Format — `::`-separated, one directive per line:
#   require::<kind>::<pattern>::<label>::<claim-regex>
#   forbid::<kind>::<pattern>::<label>::<why>
#   report-marker::<literal>
#   report-min::<n>
#
#   <kind>        skill | bash
#   <pattern>     skill id (exact), or an extended regex matched against the
#                 Bash command as recorded in the transcript
#   <label>       what a human sees in the block message
#   <claim-regex> optional. If the report ASSERTS this step ran but no record
#                 exists, the block message names it a fabricated claim rather
#                 than a plain omission. This is the difference between "you
#                 skipped it" and "you skipped it and said you hadn't".
#
# ATTEMPT, NOT SUCCESS. A require row is satisfied by the RECORD of the call, not
# by its exit code. A skill that is unavailable, a `dotnet` that is not installed,
# a solution that will not restore — all leave a record, and all satisfy the row.
# That is deliberate: it keeps the honest `skipped (unavailable)` verdict the
# prose allows, while removing the option of deciding a step was unnecessary
# without ever trying it. If a step truly cannot run, run it anyway and let the
# failure be the evidence. It costs one command.

# --- When to check ----------------------------------------------------------
# The contract opens at the last Skill call naming this skill and is checked only
# when the reply is report-shaped. Mid-review turns pass untouched, so the hook
# never interrupts work in progress — it gates the deliverable.
report-marker::Scope
report-marker::Sources
report-marker::Tools
report-marker::Findings
report-marker::Verdict
report-min::3

# --- The companion ----------------------------------------------------------
require::skill::orfi-kit-xml-docs::orfi-kit-xml-docs companion skill::xml[ -]?docs
# NO security-review row, deliberately. Codex ships no security-review
# skill, and this skill's prose says so — it asks for the gap to be reported as
# `not run (no security-review skill available)` rather than papered over.
# Requiring a skill that cannot exist would make the gate fire on correct
# behaviour, and a gate that cries wolf gets bypassed and then ignored.

# --- The tool lane (SKILL.md: "always runs, whatever the focus") ------------
require::bash::dotnet format::dotnet format --verify-no-changes::dotnet format
require::bash::dotnet build::dotnet build::dotnet build
require::bash::dotnet test::dotnet test::dotnet test

# --- Scope resolution -------------------------------------------------------
# The fork-point diff that defines what is under review.
require::bash::git diff --name-only::branch diff over '*.cs' (scope resolution)::git diff

# --- Traps: a pass that inspected nothing -----------------------------------
# `--changed` is `git diff HEAD` plus staged — uncommitted work only. At review
# time the tree is clean, so it resolves to an empty list, prints "No .cs files
# to check" and exits 0. A green run that read zero files is the most dangerous
# result this skill can produce, because it looks identical to a real pass.
#
# Both spellings must be caught: the PowerShell checker takes `-Changed` (one
# dash) and the bash one takes `--changed` (two). Matching only the bash form
# would leave the trap wide open in the pwsh invocation SKILL.md recommends
# first, which is the more likely one on this user's machine.
forbid::bash::check-xml-docs[^"]*--?[Cc]hanged::check-xml-docs run with -Changed/--changed::--changed (bash) and -Changed (pwsh) inspect only UNCOMMITTED work; at review time that is an empty list and a meaningless exit 0. Use -Files/--files with the branch diff.
# `merge-base HEAD @{u}` resolves to the last PUSHED commit, silently omitting
# every commit already pushed — reviewing a fraction of the story while appearing
# to review all of it.
forbid::bash::merge-base +HEAD +@\{u\}::base resolved with @{u}::@{u} is this branch's own remote, so the diff omits already-pushed commits. Resolve the fork point from the parent epic branch or the trunk.
