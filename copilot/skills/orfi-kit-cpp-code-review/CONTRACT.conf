# orfi-kit-cpp-code-review — enforcement contract (Copilot copy)
#
# MECHANICALLY ENFORCED WHEN THE NATIVE HOOKS ARE INSTALLED — READ THIS FIRST.
#
# Kept beside SKILL.md in both variants so they cannot drift apart. It is read by
# ~/.claude/hooks/orfi-kit-verify-skill-contract.sh, which Claude Code wires as a
# Stop hook and the Copilot copy registers as a native Stop hook
# (~/.copilot/hooks/orfi-kit.json). OpenCode has no Stop event, so it is not
# enforced there. Without the native Copilot hooks these rows are a CHECKLIST, not
# a gate — treat every `require` as mandatory anyway. See the C# contract beside
# orfi-kit-csharp-code-review for the full rationale.
#
# Machine-read by ~/.claude/hooks/orfi-kit-verify-skill-contract.sh (Claude Code
# settings.json + Copilot ~/.copilot/hooks/orfi-kit.json).
# See the C# contract beside orfi-kit-csharp-code-review/SKILL.md for the full
# rationale and the directive format; this file assumes both.
#
# Why this lists less of the toolchain than the C# contract. Keep two things apart:
#
#   RULES are never missing. Repo .clang-format / .clang-tidy is the contract; absent
#   both — the common C++ case — the CONFIG.md baseline becomes the contract (the
#   guardrails extension already tells the author to treat it that way and report
#   deviation as a violation). So "no config" never means "nothing to check".
#
#   EXECUTABLES genuinely may be absent, and that is what a `require::bash` row
#   depends on. clang-format, clang-tidy, and the build/test drivers are separate
#   installs, and clang-tidy additionally needs a compile_commands.json that
#   SKILL.md forbids generating — that is a build action, not a review action. In C#
#   the equivalents ship with the SDK.
#
# A contract can only require COMMANDS, so only the second category applies. Build
# and test commands also vary per project (make, ninja, msbuild, ctest, a project
# script), so pinning literal strings would be wrong more often than right. The
# prose still mandates them and still demands that anything which could not run is
# named and treated as unconfirmed rather than clean.

# --- When to check ----------------------------------------------------------
report-marker::Scope
report-marker::Sources
report-marker::Tools
report-marker::Findings
report-marker::Verdict
report-min::3

# --- The companion ----------------------------------------------------------
require::skill::orfi-kit-doxygen-docs::orfi-kit-doxygen-docs companion skill::doxygen
# NO security-review row, deliberately — Copilot CLI ships no security-review
# skill, and this skill's prose asks for the gap to be reported as
# `not run (no security-review skill available)` instead. See the C# contract.

# --- Scope resolution -------------------------------------------------------
require::bash::git diff --name-only::branch diff over C/C++ sources (scope resolution)::git diff

# --- Traps ------------------------------------------------------------------
# Both spellings: pwsh takes `-Changed`, bash takes `--changed`.
forbid::bash::check-doxygen-docs[^"]*--?[Cc]hanged::check-doxygen-docs run with -Changed/--changed::--changed (bash) and -Changed (pwsh) inspect only UNCOMMITTED work; at review time that is an empty list and a meaningless exit 0. Use -Files/--files with the branch diff.
forbid::bash::merge-base +HEAD +@\{u\}::base resolved with @{u}::@{u} is this branch's own remote, so the diff omits already-pushed commits. Resolve the fork point from the parent epic branch or the trunk.
# A review reports; it never rewrites the code under review.
forbid::bash::clang-format +(-i|--in-place)::clang-format -i (rewrites the code under review)::a review reports what differs. Use --dry-run -Werror.
