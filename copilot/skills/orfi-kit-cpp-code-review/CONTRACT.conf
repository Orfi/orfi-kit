# orfi-kit-cpp-code-review — enforcement contract (Copilot copy)
#
# NOT MECHANICALLY ENFORCED ON COPILOT — READ THIS FIRST.
#
# Kept here so the Copilot and Claude Code variants cannot drift apart, but nothing
# on Copilot reads it: that SDK has only onSessionStart and onUserPromptSubmitted,
# with no post-response event to hang a verifier on. On Copilot these rows are a
# CHECKLIST, not a gate — treat every `require` as mandatory anyway. Under Claude
# Code the same rows ARE enforced by a Stop hook. See the C# contract beside
# orfi-kit-csharp-code-review for the full rationale.
#
# Machine-read (Claude Code only) by ~/.claude/hooks/orfi-kit-verify-skill-contract.sh.
# See the C# contract beside orfi-kit-csharp-code-review/SKILL.md for the full
# rationale and the directive format; this file assumes both.
#
# C++ differs from C# in one way that matters here: missing tooling is the NORM,
# not the exception. Most repos ship no .clang-format, no .clang-tidy, and no
# compile_commands.json, and SKILL.md says so explicitly. So this contract requires
# far less of the toolchain than the C# one does — requiring `clang-tidy` in a repo
# that has no compilation database would train the hook to fire on correct
# behaviour, and a gate that cries wolf gets bypassed and then ignored.
#
# What is required here is only what is unconditional: the two companion skills and
# the scope diff. Formatting, build, and test commands vary per project (make,
# ninja, msbuild, ctest, or a project-specific script), so pinning them to literal
# strings would be wrong more often than right. The prose still mandates them and
# still demands honesty about what could not run.

# --- When to check ----------------------------------------------------------
report-marker::Scope
report-marker::Sources
report-marker::Tools
report-marker::Findings
report-marker::Verdict
report-min::3

# --- The companion ----------------------------------------------------------
require::skill::orfi-kit-doxygen-docs::orfi-kit-doxygen-docs companion skill::doxygen
# NO security-review row, deliberately — Copilot CLI ships no security-review
# skill, and this skill's prose asks for the gap to be reported as
# `not run (no security-review skill available)` instead. See the C# contract.

# --- Scope resolution -------------------------------------------------------
require::bash::git diff --name-only::branch diff over C/C++ sources (scope resolution)::git diff

# --- Traps ------------------------------------------------------------------
# Both spellings: pwsh takes `-Changed`, bash takes `--changed`.
forbid::bash::check-doxygen-docs[^"]*--?[Cc]hanged::check-doxygen-docs run with -Changed/--changed::--changed (bash) and -Changed (pwsh) inspect only UNCOMMITTED work; at review time that is an empty list and a meaningless exit 0. Use -Files/--files with the branch diff.
forbid::bash::merge-base +HEAD +@\{u\}::base resolved with @{u}::@{u} is this branch's own remote, so the diff omits already-pushed commits. Resolve the fork point from the parent epic branch or the trunk.
# A review reports; it never rewrites the code under review.
forbid::bash::clang-format +(-i|--in-place)::clang-format -i (rewrites the code under review)::a review reports what differs. Use --dry-run -Werror.
